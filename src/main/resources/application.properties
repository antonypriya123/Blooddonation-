# =======================================================
# BloodConnect Application Configuration
# Powered by Spring Boot & Railway Cloud MySQL
# =======================================================

spring.application.name=BloodConnect

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Cloud MySQL Datasource (supports Aiven Cloud, Railway native variables, and custom DB_* variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate / JPA Configuration (Flyway handles schema migrations)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health Check for Railway & Cloud deployment
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
