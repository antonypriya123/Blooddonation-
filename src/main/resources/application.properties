# =======================================================
# BloodConnect Application Configuration
# Powered by Spring Boot & Railway Cloud MySQL
# =======================================================

spring.application.name=BloodConnect

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Railway Cloud MySQL Datasource (supports both Railway native variables and custom DB_* variables)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:${DB_HOST:reseau.proxy.rlwy.net}}:${MYSQLPORT:${DB_PORT:54263}}/${MYSQLDATABASE:${DB_NAME:railway}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Health Check for Railway & Cloud deployment
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
